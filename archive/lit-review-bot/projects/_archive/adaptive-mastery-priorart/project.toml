[project]
slug        = "adaptive-mastery-priorart"
title       = "Prior art for Bayesian cold-start mastery learning (WAILS 2026)"
description = """
Related-work discovery for a WAILS 2026 submission on a Bayesian adaptive mastery-learning
system: a graph-Laplacian-prior Kalman update for cold-start knowledge-state estimation over
a prerequisite DAG, a frontier stopping rule, and an asymmetric credential-assignment rule.
Two lineages matter: (1) knowledge tracing (BKT/DKT/graph-based KT/cold-start KT), the modern
line our method sits in; (2) knowledge space theory (Doignon & Falmagne), the older structural
framework for adaptive knowledge assessment that a psychometrics-literate reviewer would expect
us to position against.
"""
criteria = """
Include if the paper is primarily concerned with any of:
- Knowledge tracing methods (BKT, DKT, deep/attention-based KT, graph-based KT) that model
  latent student knowledge state from a response sequence.
- Knowledge space theory / competence-based knowledge structures: formal frameworks for
  representing prerequisite or knowledge structure and adaptive assessment within them
  (including the ALEKS lineage).
- Cold-start problems in student modeling: few-shot, meta-learning, or prior-based approaches
  to initializing a knowledge-state estimate for a new learner with no response history.
- Computerized adaptive testing: item-selection strategies, stopping rules, or
  uncertainty-based termination criteria.
- Bayesian or probabilistic latent-trait estimation for education (IRT extensions,
  Kalman-filter or particle-filter student models).
- Graph-Laplacian or network-regularized approaches to latent-state estimation, even when
  not education-specific — theoretical grounding papers count.
- Prerequisite-graph-driven mastery learning, skill-tree systems, or curriculum sequencing
  that encodes and exploits a DAG of skill dependencies.
- Uncertainty communication / open learner models: how a system represents and communicates
  confidence in an inferred student knowledge state to learners or teachers.

Exclude:
- LLM-tutoring-dialogue papers with no explicit student-knowledge-state model (unless
  specifically about uncertainty communication).
- Classroom/teacher analytics, affect, engagement, or fairness papers without a
  knowledge-state-estimation component.
- General educational data mining (dropout/grade prediction) unless it uses a KT/KST-style
  latent knowledge model.
- Content-generation-only papers (question generation, essay scoring) unless they also
  address cold-start or diagnostic placement.
"""

