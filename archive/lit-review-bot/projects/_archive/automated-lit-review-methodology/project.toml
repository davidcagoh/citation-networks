[project]
slug        = "automated-lit-review-methodology"
title       = "Automated Literature Review Methodology"
description = """
The intersection of automated literature review generation, citation graph
traversal methodologies, and stopping criteria for abstract screening. We are
specifically interested in systems that use LLMs or active learning to automate
systematic reviews, the structural properties of citation networks (such as
scale-free distributions and hub suppression) that affect traversal, and
statistical or heuristic stopping rules used to bound the screening process.
"""
criteria = """
Include a paper if it meets ANY of the following:
1. Proposes or evaluates an automated system for literature reviews, systematic
   reviews, or scientific surveys (especially LLM-based or RAG-based systems).
2. Addresses citation snowballing, graph traversal for information retrieval, or
   handling heavy-tailed/scale-free degree distributions in citation networks.
3. Defines or evaluates stopping criteria, yield thresholds, or continuous active
   learning heuristics for abstract screening.
4. Must be peer-reviewed, a preprint from arXiv/medRxiv, or a canonical
   foundational paper.
Exclude if:
- The paper merely conducts a systematic review using standard manual methods
  without proposing or evaluating automation tools.
- General graph theory paper with no application to information retrieval,
  citation networks, or document clustering.
- General LLM benchmark paper that does not specifically address scientific
  literature synthesis or RAG over academic corpora.
"""

