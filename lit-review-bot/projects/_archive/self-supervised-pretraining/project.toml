[project]
slug        = "self-supervised-pretraining"
title       = "Self-supervised pre-training for audio and speech"
description = """
A systematic review of self-supervised learning (SSL) methods for audio and speech
representation learning. Covers masked autoencoders, contrastive learning,
self-distillation (DINO-style), and predictive coding applied to spectrograms and
waveforms; empirical analysis of representation quality; representation collapse;
label-efficiency; and adaptation of vision SSL methods (MAE, DINO, SimCLR, etc.)
to the audio domain.
"""
criteria = """
Include if the paper addresses any of:
- Self-supervised learning (SSL) methodology for audio or speech — masked autoencoders,
  contrastive learning, self-distillation, predictive coding, or joint-embedding
  architectures applied to spectrograms or waveforms, where the SSL training objective
  itself is a central contribution or focus.
- Empirical analysis of SSL pre-training quality for audio/speech: probing, KNN
  evaluation, linear evaluation, or other representation quality metrics — especially
  studies that examine when SSL works or fails (data scale, corpus diversity, collapse,
  transfer).
- Audio/speech transformer architectures (patch-based, spectrogram tokenisation) when
  used as SSL encoder backbones or studied in the context of SSL pre-training.
- Representation collapse, mode collapse, or training instability in SSL — analysis,
  detection, or mitigation (centering, EMA schedules, augmentation strategies,
  architecture choices).
- Label-efficiency, semi-supervised, or low-resource audio classification where SSL
  pre-training is the key variable being studied.
- Knowledge distillation or student-teacher self-supervised objectives (DINO-style,
  EMA teachers) for audio or speech representation learning.
- SSL methods originally developed for vision (MAE, DINO, SimCLR, MoCo, BYOL,
  BarlowTwins, etc.) that are directly adapted or empirically compared on audio/speech
  datasets.

Exclude:
- Pure vision SSL papers with no connection to audio, speech, or sound.
- ASR / speech synthesis / speaker verification papers not primarily focused on SSL
  methodology or representation learning.
- Audio generation, text-to-speech, codec, or audio captioning/retrieval papers whose
  primary contribution is a downstream application (not the SSL pre-training objective).
- Supervised audio classification papers, even if they use transformer architectures.
- Domain-specific audio application papers (wildlife/ecoacoustics, medical audio,
  underwater acoustics, industrial/machinery sounds, animal vocalisation) that apply
  SSL as a tool without investigating SSL pre-training behaviour.
- Multi-task learning, emotion recognition, or speaker recognition papers without a
  primary focus on SSL pre-training dynamics.
- Dataset or benchmark papers without SSL methodology contribution.
- Survey/review papers on audio or ML generally (unless specifically surveying SSL
  for audio).
- Optimiser, regularisation, or general deep learning papers without direct audio/SSL
  connection.
"""

[[seeds]]
arxiv_id = "2111.06377"   # He et al. (2022) — MAE: Masked Autoencoders Are Scalable Vision Learners

[[seeds]]
arxiv_id = "2104.14294"   # Caron et al. (2021) — DINO: Emerging Properties in Self-Supervised Vision Transformers

[[seeds]]
arxiv_id = "2207.06405"   # Huang et al. (2022) — AudioMAE: Masked Autoencoders that Listen

[[seeds]]
arxiv_id = "2104.01778"   # Gong et al. (2021) — AST: Audio Spectrogram Transformer

[[seeds]]
arxiv_id = "2305.10005"   # Chen et al. (2023) — DinoSR: Self-Distillation and Online Clustering for Self-supervised Speech

[[seeds]]
doi = "10.1145/2733373.2806390"   # Piczak (2015) — ESC-50 dataset

[loop]
yield_threshold   = 0.05
stale_rounds      = 2
escape_attempts   = 2
hub_percentile    = 80
screen_batch      = 20
max_rounds        = 60
