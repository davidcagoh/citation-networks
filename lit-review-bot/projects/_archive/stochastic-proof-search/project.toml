[project]
slug        = "stochastic-proof-search"
title       = "Stochastic Proof Search on AND-OR Hypertrees"
description = """
A systematic review of formal theoretical guarantees on the expected hitting time
of stochastic proof search over AND-OR hypertrees. Covers how policy quality
(learned or fixed) interacts with tree structure (depth, AND-branching factor) to
determine convergence bounds. Four axes: (A) AND-OR tree complexity, (B) MCTS/UCT
convergence, (C) drift analysis and biased random walks, (D) learning-guided search
theory. High-priority papers bridge axes A+C or A+D.
"""
criteria = """
Include if the paper satisfies at least one of:
1. Proves a bound (upper or lower) on the expected number of steps/queries for a
   randomized algorithm to evaluate or close an AND-OR tree or game tree.
2. Analyzes the convergence rate or regret of MCTS, UCT, or a related tree-search
   algorithm with a formal proof.
3. Proves a hitting-time or first-passage-time bound for a biased random walk or
   stochastic process that is explicitly applied to combinatorial search or proof search.
4. Proves a result about policy improvement, expert iteration, or learning-guided search
   that includes a formal convergence or monotonicity guarantee.
5. Establishes a proof complexity lower bound (tree-like or dag-like) that directly
   constrains the number of search steps any algorithm must take.
6. Formalizes any of the above in a proof assistant (Lean, Coq, Isabelle, HOL).

Exclude if any of:
- The convergence result is purely empirical (no theorem with proof).
- The tree/graph model is a two-player zero-sum game tree without an AND-OR
  proof-search interpretation.
- The paper is about SAT solving but does not connect to hitting-time or
  expected-search-time bounds (e.g., pure CDCL implementation papers).
- The paper addresses only asymptotic complexity (Θ-notation) without constants
  or explicit dependence on policy quality parameters.
- The paper's primary contribution is a new neural architecture or training recipe
  without theoretical analysis.
"""

